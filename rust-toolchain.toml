[toolchain]
# Pinned to a concrete patch — `stable` alone floats past MSRV bumps and
# edition-2024 hard-error changes (e.g. `std::env::set_var`). 1.86 is the first
# patch where every transitive dep we pull (clap_lex 1.1+ etc.) parses without
# requiring an unstable cargo feature. Bump in its own PR.
channel = "1.86.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
