[package]
name = "eth-tools-workers"
description = "Shared logic for the 8 autonomous worker agents"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
vercel_runtime.workspace = true
subtle.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
alloy.workspace = true
eth-tools-core.workspace = true
eth-tools-rpc.workspace = true
eth-tools-db.workspace = true

# W2 (manifest_fetcher) needs:
#  - jsonschema for the ERC-8004 manifest validation pass
#  - reqwest for the Vercel Blob upload (direct PUT, no extra dep)
#  - bigdecimal for the agent_id NUMERIC(78,0) column
jsonschema.workspace = true
reqwest.workspace = true
bigdecimal.workspace = true
chrono.workspace = true
sqlx.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "net"] }
http = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
testcontainers.workspace = true
testcontainers-modules.workspace = true
axum = { workspace = true }
