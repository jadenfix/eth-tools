name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Bootstrap scaffold — Biome-style cross-platform binary release + npm
# meta-package. See plan §16. Fully wired in Phase 7.
#
# Default to read-only; the publish job overrides with the minimum write
# permissions it actually needs once Phase 7 lands.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Actions pinned to commit SHAs; floating tags (`@v4`) are mutable and a
      # compromised tag could backdoor the release artifacts users download.
      # Trailing `# vX.Y.Z` is required so Dependabot can still bump us.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable@2026-05
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --bin eth-tools

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eth-tools-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/eth-tools
            target/${{ matrix.target }}/release/eth-tools.exe
          if-no-files-found: ignore

  publish-stub:
    name: publish (stub — wired in Phase 7)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - run: echo "npm publish + GitHub Release wired in Phase 7 per plan §16."
