name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Bootstrap scaffold — Biome-style cross-platform binary release + npm
# meta-package. See plan §16. Fully wired in Phase 7.
#
# Default to read-only; the publish job overrides with the minimum write
# permissions it actually needs once Phase 7 lands.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest    target: x86_64-unknown-linux-musl
          - os: ubuntu-latest    target: aarch64-unknown-linux-gnu
          - os: macos-latest     target: x86_64-apple-darwin
          - os: macos-latest     target: aarch64-apple-darwin
          - os: windows-latest   target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} --bin eth-tools

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eth-tools-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/eth-tools
            target/${{ matrix.target }}/release/eth-tools.exe
          if-no-files-found: ignore

  publish-stub:
    name: publish (stub — wired in Phase 7)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - run: echo "npm publish + GitHub Release wired in Phase 7 per plan §16."
