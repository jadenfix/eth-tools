name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt · clippy · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build (debug, full workspace)
        run: cargo build --workspace --locked

  audit:
    name: cargo audit · pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit || true
      - name: cargo audit
        run: cargo audit --deny warnings || true   # advisory-only until first real PR
      - uses: pnpm/action-setup@v4
        # version pinned via `packageManager` field in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm audit --prod --audit-level=high || true   # advisory-only

  typescript:
    name: typescript (typecheck · lint · gen-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version pinned via `packageManager` field in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm gen:types — assert no drift
        run: |
          bash scripts/gen-types.sh
          git diff --exit-code -- app/openapi.json app/lib/api-types.ts
