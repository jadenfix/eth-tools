name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of least privilege: every job needs only read access to the repo.
# Override per-job (never per-workflow) if a job needs writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt · clippy · test · build)
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs; floating tags (`@v4`) are mutable and a
      # compromised tag could backdoor a job that handles ERC-8004 signing.
      # Trailing `# vX.Y.Z` is required so Dependabot can still bump us.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable@2026-05
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          shared-key: workspace

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build (debug, full workspace)
        run: cargo build --workspace --locked

  audit:
    name: cargo audit · pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable@2026-05
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          shared-key: workspace
      - name: Install cargo-audit
        # `|| true` is intentional: install fails on cache-hit because the
        # binary is already present. We then re-check `command -v` so that a
        # genuine install failure (transient registry, network) does not let
        # the next `cargo audit` step error with "command not found" and have
        # the job pass green.
        run: |
          cargo install --locked cargo-audit || true
          command -v cargo-audit || { echo "::error::cargo-audit not on PATH after install"; exit 1; }
      - name: cargo audit (fail on any advisory)
        run: cargo audit --deny warnings
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version pinned via `packageManager` field in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail on high+)
        run: pnpm audit --prod --audit-level=high

  typescript:
    name: typescript (typecheck · lint · gen-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version pinned via `packageManager` field in package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable@2026-05
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          shared-key: workspace

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm gen:types — assert no drift
        run: |
          bash scripts/gen-types.sh
          git diff --exit-code -- app/openapi.json app/lib/api-types.ts
