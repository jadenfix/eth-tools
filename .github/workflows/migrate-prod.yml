name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - 'crates/db/migrations/**'
  workflow_dispatch:

# Principle of least privilege. Migration secrets come from the `production`
# environment scope; the workflow itself only needs to read the repo.
permissions:
  contents: read

jobs:
  migrate:
    name: sqlx migrate run
    runs-on: ubuntu-latest
    environment:
      name: production       # GitHub environment with required reviewer
      url: https://eth-tools.dev
    steps:
      # Actions pinned to commit SHAs because this workflow holds production DB
      # write credentials. Floating tags (`@v4`) are mutable; a compromised tag
      # would gain `NEON_PROD_URL_UNPOOLED`. Bump the SHA in a follow-up PR.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable@2026-05
      - uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Install sqlx-cli
        run: cargo install --locked sqlx-cli --version "^0.8" --no-default-features --features postgres,rustls

      - name: Run migrations against Neon (unpooled, transactional)
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_PROD_URL_UNPOOLED secret is not set. Configure under Settings → Environments → production."
            exit 1
          fi
          sqlx migrate run --source crates/db/migrations
