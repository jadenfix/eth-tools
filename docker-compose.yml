services:
  postgres:
    image: postgres:16
    container_name: eth-tools-postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: eth_tools
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d eth_tools"]
      interval: 5s
      timeout: 3s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: eth-tools-dragonfly
    restart: unless-stopped
    ports: ["6379:6379"]
    ulimits:
      memlock: -1
    command: ["--logtostderr"]

  # Local Base fork — for worker integration tests and write-path drills.
  # Disabled by default; start with: docker compose up -d anvil
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: eth-tools-anvil
    profiles: ["chain"]
    command: ["anvil --fork-url https://mainnet.base.org --chain-id 8453 --host 0.0.0.0"]
    ports: ["8545:8545"]

volumes:
  postgres_data:
